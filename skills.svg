<svg width="1000" height="440" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1428"/>
      <stop offset="1" stop-color="#080b18"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .lab { font-size: 17px; font-weight: 600; fill: #e5e7eb; }
    .pct { font-size: 15px; font-weight: 600; fill: #94a3b8; }
  </style>

  <rect x="2" y="2" width="996" height="436" rx="22" fill="url(#card)" stroke="url(#edge)" stroke-opacity="0.55" stroke-width="2"/>
  <text class="sans" x="500" y="62" text-anchor="middle" font-size="26" font-weight="800" fill="url(#bar)" letter-spacing="10">SKILLS</text>

  <g class="sans">
    <!-- LEFT COLUMN -->
    <!-- TypeScript 90 -->
    <circle cx="66" cy="120" r="5" fill="#3178c6"/>
    <text class="lab" x="82" y="126">TypeScript</text>
    <text class="pct" x="460" y="126" text-anchor="end">90%</text>
    <rect x="60" y="140" width="400" height="10" rx="5" fill="#1a2240"/>
    <rect x="60" y="140" height="10" rx="5" width="0" fill="url(#bar)">
      <animate attributeName="width" values="0;360;360;0" keyTimes="0;0.3;0.9;1" dur="9s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.5 1"/>
    </rect>
    <circle cy="145" r="6" fill="#ffffff" filter="url(#glow)">
      <animate attributeName="cx" values="60;420;420;60" keyTimes="0;0.3;0.9;1" dur="9s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.5 1"/>
    </circle>

    <!-- Python 85 -->
    <circle cx="66" cy="200" r="5" fill="#ffd43b"/>
    <text class="lab" x="82" y="206">Python</text>
    <text class="pct" x="460" y="206" text-anchor="end">85%</text>
    <rect x="60" y="220" width="400" height="10" rx="5" fill="#1a2240"/>
    <rect x="60" y="220" height="10" rx="5" width="0" fill="url(#bar)">
      <animate attributeName="width" values="0;340;340;0" keyTimes="0;0.3;0.9;1" dur="9s" begin="0.15s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.5 1"/>
    </rect>
    <circle cy="225" r="6" fill="#ffffff" filter="url(#glow)">
      <animate attributeName="cx" values="60;400;400;60" keyTimes="0;0.3;0.9;1" dur="9s" begin="0.15s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.5 1"/>
    </circle>

    <!-- React 88 -->
    <circle cx="66" cy="280" r="5" fill="#61dafb"/>
    <text class="lab" x="82" y="286">React</text>
    <text class="pct" x="460" y="286" text-anchor="end">88%</text>
    <rect x="60" y="300" width="400" height="10" rx="5" fill="#1a2240"/>
    <rect x="60" y="300" height="10" rx="5" width="0" fill="url(#bar)">
      <animate attributeName="width" values="0;352;352;0" keyTimes="0;0.3;0.9;1" dur="9s" begin="0.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.5 1"/>
    </rect>
    <circle cy="305" r="6" fill="#ffffff" filter="url(#glow)">
      <animate attributeName="cx" values="60;412;412;60" keyTimes="0;0.3;0.9;1" dur="9s" begin="0.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.5 1"/>
    </circle>

    <!-- Node.js 80 -->
    <circle cx="66" cy="360" r="5" fill="#68a063"/>
    <text class="lab" x="82" y="366">Node.js</text>
    <text class="pct" x="460" y="366" text-anchor="end">80%</text>
    <rect x="60" y="380" width="400" height="10" rx="5" fill="#1a2240"/>
    <rect x="60" y="380" height="10" rx="5" width="0" fill="url(#bar)">
      <animate attributeName="width" values="0;320;320;0" keyTimes="0;0.3;0.9;1" dur="9s" begin="0.45s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.5 1"/>
    </rect>
    <circle cy="385" r="6" fill="#ffffff" filter="url(#glow)">
      <animate attributeName="cx" values="60;380;380;60" keyTimes="0;0.3;0.9;1" dur="9s" begin="0.45s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.5 1"/>
    </circle>

    <!-- RIGHT COLUMN -->
    <!-- Docker 70 -->
    <circle cx="546" cy="120" r="5" fill="#2496ed"/>
    <text class="lab" x="562" y="126">Docker</text>
    <text class="pct" x="940" y="126" text-anchor="end">70%</text>
    <rect x="540" y="140" width="400" height="10" rx="5" fill="#1a2240"/>
    <rect x="540" y="140" height="10" rx="5" width="0" fill="url(#bar)">
      <animate attributeName="width" values="0;280;280;0" keyTimes="0;0.3;0.9;1" dur="9s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.5 1"/>
    </rect>
    <circle cy="145" r="6" fill="#ffffff" filter="url(#glow)">
      <animate attributeName="cx" values="540;820;820;540" keyTimes="0;0.3;0.9;1" dur="9s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.5 1"/>
    </circle>

    <!-- PostgreSQL 75 -->
    <circle cx="546" cy="200" r="5" fill="#336791"/>
    <text class="lab" x="562" y="206">PostgreSQL</text>
    <text class="pct" x="940" y="206" text-anchor="end">75%</text>
    <rect x="540" y="220" width="400" height="10" rx="5" fill="#1a2240"/>
    <rect x="540" y="220" height="10" rx="5" width="0" fill="url(#bar)">
      <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.3;0.9;1" dur="9s" begin="0.75s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.5 1"/>
    </rect>
    <circle cy="225" r="6" fill="#ffffff" filter="url(#glow)">
      <animate attributeName="cx" values="540;840;840;540" keyTimes="0;0.3;0.9;1" dur="9s" begin="0.75s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.5 1"/>
    </circle>

    <!-- Go 60 -->
    <circle cx="546" cy="280" r="5" fill="#00add8"/>
    <text class="lab" x="562" y="286">Go</text>
    <text class="pct" x="940" y="286" text-anchor="end">60%</text>
    <rect x="540" y="300" width="400" height="10" rx="5" fill="#1a2240"/>
    <rect x="540" y="300" height="10" rx="5" width="0" fill="url(#bar)">
      <animate attributeName="width" values="0;240;240;0" keyTimes="0;0.3;0.9;1" dur="9s" begin="0.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.5 1"/>
    </rect>
    <circle cy="305" r="6" fill="#ffffff" filter="url(#glow)">
      <animate attributeName="cx" values="540;780;780;540" keyTimes="0;0.3;0.9;1" dur="9s" begin="0.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.5 1"/>
    </circle>

    <!-- Linux 82 -->
    <circle cx="546" cy="360" r="5" fill="#fcc624"/>
    <text class="lab" x="562" y="366">Linux</text>
    <text class="pct" x="940" y="366" text-anchor="end">82%</text>
    <rect x="540" y="380" width="400" height="10" rx="5" fill="#1a2240"/>
    <rect x="540" y="380" height="10" rx="5" width="0" fill="url(#bar)">
      <animate attributeName="width" values="0;328;328;0" keyTimes="0;0.3;0.9;1" dur="9s" begin="1.05s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.5 1"/>
    </rect>
    <circle cy="385" r="6" fill="#ffffff" filter="url(#glow)">
      <animate attributeName="cx" values="540;868;868;540" keyTimes="0;0.3;0.9;1" dur="9s" begin="1.05s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1;0 0 1 1;0.5 0 0.5 1"/>
    </circle>
  </g>
</svg>
