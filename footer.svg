<svg width="1000" height="230" viewBox="0 0 1000 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="“Talk is cheap. Show me the code.” Linus Torvalds" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04060f"/><stop offset="0.6" stop-color="#0a1030"/><stop offset="1" stop-color="#150a33"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ec4899" stop-opacity="0.5"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <clipPath id="frame"><rect width="1000" height="230" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="230" fill="url(#sky)"/>
    <ellipse rx="240" ry="60" fill="#a78bfa" opacity="0.30" filter="url(#soft)">
      <animate attributeName="cx" values="360;640;360" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="50;90;50" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <g transform="translate(0 -130)">
      <path fill="url(#w3)" d="M0 336 Q150 316 300 336 T600 336 T900 336 T1200 336 T1500 336 T1800 336 V360 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="18s" repeatCount="indefinite"/>
      </path>
      <path fill="url(#w2)" d="M0 318 Q100 290 200 318 T400 318 T600 318 T800 318 T1000 318 T1200 318 T1400 318 T1600 318 V360 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="-400 0" to="0 0" dur="14s" repeatCount="indefinite"/>
      </path>
      <path fill="url(#w1)" d="M0 300 Q125 262 250 300 T500 300 T750 300 T1000 300 T1250 300 T1500 300 T1750 300 T2000 300 V360 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="10s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="500" y="82" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="url(#bar)">“Talk is cheap. Show me the code.”</text>
    <text x="500" y="116" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">Linus Torvalds</text>
  </g>
  <rect x="1" y="1" width="998" height="228" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>